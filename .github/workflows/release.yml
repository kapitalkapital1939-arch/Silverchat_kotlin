name: Release

# Релизный конвейер: tag vX.Y.Z -> versionCode/versionName -> signed AAB -> GitHub Release.
# Автономно: versionCode считается из количества коммитов, внешний сервис версий не нужен.

on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:
    inputs:
      publish_to_play_store:
        description: 'Загрузить в Google Play (internal track)'
        type: boolean
        default: false

permissions:
  contents: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.caching=true

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Android build environment
        uses: ./.github/actions/setup-android-build

      - name: Derive version
        id: version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          [ -z "$TAG" ] && TAG="0.0.0"
          COMMITS=$(git rev-list --count HEAD)
          {
            echo "version_name=$TAG"
            echo "version_code=$COMMITS"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"
          echo "Release ${TAG} (code ${COMMITS})"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::RELEASE_KEYSTORE_B64 не задан — релиз не может быть подписан"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > release.keystore

      - name: Build signed AAB + APK
        env:
          SILVERCHAT_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          SILVERCHAT_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SILVERCHAT_KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          SILVERCHAT_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          SILVERCHAT_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          SILVERCHAT_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          # Пины сертификатов (через запятую, формат sha256/<base64>).
          # Без них release-сборка собирается БЕЗ пиннинга — см.
          # backend-contract/06-security.md, раздел «Certificate pinning».
          SILVERCHAT_CERT_PINS: ${{ secrets.CERT_PINS }}
        run: ./gradlew --stacktrace :app:bundleRelease :app:assembleRelease

      - name: Verify signature
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          "$ANDROID_HOME"/build-tools/36.0.0/apksigner verify --print-certs "$APK"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.tag }}
          name: SilverChat v${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload to Play Store (internal)
        if: ${{ inputs.publish_to_play_store }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.silverchat.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
