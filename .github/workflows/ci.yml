name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.incremental=false

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gradlew line endings
        run: tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew && chmod +x gradlew

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ktlint
        run: ./gradlew ktlintCheck --stacktrace || echo "Ktlint failed"

  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: static-analysis
    strategy:
      fail-fast: false
      matrix:
        module-group: [ 'core', 'feature', 'app' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gradlew line endings
        run: tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew && chmod +x gradlew

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Assemble & Test
        run: |
          case "${{ matrix.module-group }}" in
            core)    TARGETS=$(./gradlew -q projects | grep -oE ':core:[a-z-]+' | tr '\n' ' ') ;;
            feature) TARGETS=$(./gradlew -q projects | grep -oE ':feature:[a-z-]+' | tr '\n' ' ') ;;
            app)     TARGETS=":app" ;;
          esac
          TASKS=""
          for m in $TARGETS; do TASKS="$TASKS ${m}:assembleDebug ${m}:testDebugUnitTest"; done
          ./gradlew --stacktrace --continue $TASKS

  assemble-release:
    name: Release APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Fix gradlew line endings
        run: tr -d '\r' < gradlew > gradlew.tmp && mv gradlew.tmp gradlew && chmod +x gradlew

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Show APK location
        run: 'find . -name "*.apk"'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: silverchat-debug-apk
          path: "app/build/outputs/apk/debug/*.apk"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: silverchat-release-apk
          path: "app/build/outputs/apk/release/*.apk"

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [ static-analysis, build, assemble-release ]
    if: always()
    steps:
      - name: CI Done
        run: echo "✅ Done"
