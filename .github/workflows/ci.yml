name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GRADLE_OPTS: >-
    -Dorg.gradle.daemon=false
    -Dorg.gradle.parallel=true
    -Dorg.gradle.caching=true
    -Dkotlin.incremental=false

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9' # Форсируем установку чистой версии 8.9

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Ktlint
        run: gradle ktlintCheck --stacktrace || echo "Ktlint failed"

  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: static-analysis
    strategy:
      fail-fast: false
      matrix:
        module-group: [ 'core', 'feature', 'app' ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Assemble & Test
        run: |
          case "${{ matrix.module-group }}" in
            core)    TARGETS=":core" ;;
            feature) TARGETS=":feature" ;;
            app)     TARGETS=":app" ;;
          esac
          # Используем системный gradle вместо ./gradlew
          gradle ${TARGETS}:assembleDebug --stacktrace --continue

  assemble-release:
    name: Release APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: build
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build APKs
        # Это сердце фикса: мы вызываем чистый gradle напрямую
        run: gradle :app:assembleDebug :app:assembleRelease --stacktrace

      - name: Show APK location
        run: 'find . -name "*.apk"'

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: silverchat-debug-apk
          path: "app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error # Теперь он упадет, если APK не будет, а не промолчит!

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: silverchat-release-apk
          path: "app/build/outputs/apk/release/*.apk"
          if-no-files-found: error

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: [ static-analysis, build, assemble-release ]
    if: always()
    steps:
      - name: CI Done
        run: echo "✅ Done"
