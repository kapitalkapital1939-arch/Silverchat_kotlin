###################################################################################################
# SilverChat — Version Catalog (ЕДИНСТВЕННЫЙ источник версий)
#
# Правило проекта: в build.gradle.kts модулей НЕ ДОЛЖНО быть строчных версий вида "1.2.3".
# Только libs.* — иначе Gradle начнёт резолвить несколько версий одной библиотеки
# и мы вернёмся к конфликтам метаданных.
#
# Команды сопровождения:
#   ./gradlew dependencyUpdates          # (плагин versions) — что устарело
#   ./gradlew :app:dependencies --configuration releaseRuntimeClasspath   # дерево зависимостей
###################################################################################################

[versions]
# --- Build toolchain ------------------------------------------------------------------------------
agp                     = "9.4.0"      # AGP 9.4.0 (Sep 2026): Gradle >= 9.6.0, JDK 17, build-tools 36
gradle                  = "9.6.0"
kotlin                  = "2.3.21"     # версия org.jetbrains.kotlin.plugin.compose == версии Kotlin
ksp                     = "2.3.21-2.0.4"  # формат: <kotlin>-<ksp>. Держать синхронно с kotlin!
hilt                    = "2.57.2"
kover                   = "0.9.1"

# --- AndroidX / SDK -------------------------------------------------------------------------------
compileSdk              = "36"
targetSdk               = "36"
minSdk                  = "26"         # Android 8.0: WebRTC, EncryptedSharedPreferences, Java 8 API
wearMinSdk              = "30"

coreKtx                 = "1.17.0"
appcompat               = "1.7.1"
activityCompose         = "1.13.0"
lifecycle               = "2.10.0"
splashscreen            = "1.2.0"
startup                 = "1.2.0"
work                    = "2.10.3"
datastore               = "1.2.0"
room                    = "2.8.1"
securityCrypto          = "1.1.0"      # EncryptedSharedPreferences (стабильная)
biometric               = "1.2.0-alpha05"
palette                 = "1.0.0"
exifinterface           = "1.4.1"

# --- Compose --------------------------------------------------------------------------------------
composeBom              = "2026.08.00"
composeMaterial3        = "1.4.0"
navigationCompose       = "2.9.4"
hiltNavigationCompose   = "1.3.0"
accompanist             = "0.37.3"
haze                    = "1.6.9"      # backdrop-blur для glassmorphism (RenderEffect)
lottie                  = "6.7.1"      # анимированные аватарки/баннеры (Lottie JSON)
coil                    = "3.3.0"      # Coil 3: изображения + GIF + видео-превью
shimmer                 = "1.3.1"

# --- Network / serialization ----------------------------------------------------------------------
okhttp                  = "4.12.0"
retrofit                = "2.11.0"
kotlinxSerialization    = "1.9.0"
kotlinxCollections      = "0.4.0"
retrofitSerialization   = "1.0.0"

# --- Coroutines -----------------------------------------------------------------------------------
coroutines              = "1.10.2"

# --- Calls / Media --------------------------------------------------------------------------------
webrtc                  = "125.6845.04"   # io.getstream:stream-webrtc-android
media3                  = "1.8.0"

# --- Observability --------------------------------------------------------------------------------
timber                  = "5.0.1"
leakcanary              = "2.14"

# --- Desugaring (Java 8+ API на minSdk 26) ---------------------------------------------------------
desugarJdkLibs          = "2.1.5"

# --- Testing --------------------------------------------------------------------------------------
junit                   = "4.13.2"
junitExt                = "1.3.0"
espresso                = "3.7.0"
turbine                 = "1.2.1"
mockk                   = "1.14.5"
robolectric             = "4.15.1"
truth                   = "1.4.4"

# --- Static analysis -------------------------------------------------------------------------------
# detekt 1.23.x собран против Kotlin 2.0.21 и на нашем Kotlin 2.3 даёт ложные
# срабатывания (UnusedPrivateMember, NullableToStringCall) вплоть до внутренних
# ошибок анализатора. Поэтому берём ветку 2.0: alpha.6 собрана против Kotlin
# 2.4.10 / Gradle 9.6.1 / AGP 9.3.1, то есть наш стек ей знаком. В 2.0 плагин
# сменил и id (dev.detekt), и maven-координаты.
detekt                  = "2.0.0-alpha.6"
ktlintGradle            = "14.2.0"

[libraries]
# --- Kotlin ---------------------------------------------------------------------------------------
kotlin-stdlib            = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-stdlib-jdk8       = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinx-coroutines-core  = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
