###################################################################################################
# SilverChat — Version Catalog (ЕДИНСТВЕННЫЙ источник версий)
#
# Правило проекта: в build.gradle.kts модулей НЕ ДОЛЖНО быть строчных версий вида "1.2.3".
# Только libs.* — иначе Gradle начнёт резолвить несколько версий одной библиотеки
# и мы вернёмся к конфликтам метаданных.
#
# Команды сопровождения:
#   ./gradlew dependencyUpdates         # (плагин versions) — что устарело
#   ./gradlew :app:dependencies --configuration releaseRuntimeClasspath   # дерево зависимостей
###################################################################################################

[versions]
# --- Build toolchain ------------------------------------------------------------------------------
agp                   = "8.5.2"
gradle                = "8.8"
kotlin                = "2.0.21"
ksp                   = "2.0.21-1.0.25"
hilt                  = "2.51.1"
kover                 = "0.8.3"

# --- AndroidX / SDK -------------------------------------------------------------------------------
compileSdk            = "34"
targetSdk             = "34"
minSdk                = "26"
wearMinSdk            = "30"

coreKtx               = "1.13.1"
appcompat             = "1.7.0"
activityCompose       = "1.9.2"
lifecycle             = "2.8.6"
splashscreen          = "1.0.1"
startup               = "1.1.1"
work                  = "2.9.1"
datastore             = "1.1.1"
room                  = "2.6.1"
securityCrypto        = "1.1.0-alpha06"
biometric             = "1.2.0-alpha05"
palette               = "1.0.0"
exifinterface         = "1.3.7"

# --- Compose --------------------------------------------------------------------------------------
composeBom            = "2024.09.00"
composeMaterial3      = "1.3.0"
navigationCompose     = "2.8.1"
hiltNavigationCompose = "1.2.0"
accompanist           = "0.36.0"
haze                  = "1.2.0"
lottie                = "6.5.2"
coil                  = "2.7.0"
shimmer               = "1.3.1"

# --- Network / serialization ----------------------------------------------------------------------
okhttp                = "4.12.0"
retrofit              = "2.11.0"
kotlinxSerialization  = "1.7.3"
kotlinxCollections    = "0.3.8"
retrofitSerialization = "1.0.0"

# --- Coroutines -----------------------------------------------------------------------------------
coroutines            = "1.9.0"

# --- Calls / Media --------------------------------------------------------------------------------
webrtc                = "125.6845.04"
media3                = "1.4.1"

# --- Observability --------------------------------------------------------------------------------
timber                = "5.0.1"
leakcanary            = "2.14"

# --- Desugaring (Java 8+ API на minSdk 26) ---------------------------------------------------------
desugarJdkLibs        = "2.1.2"

# --- Testing --------------------------------------------------------------------------------------
junit                 = "4.13.2"
junitExt              = "1.2.1"
espresso              = "3.6.1"
turbine               = "1.1.0"
mockk                 = "1.13.12"
robolectric           = "4.13"
truth                 = "1.4.4"

# --- Static analysis -------------------------------------------------------------------------------
detekt                = "1.23.6"
ktlintGradle          = "12.1.1"

[libraries]
# --- Kotlin ---------------------------------------------------------------------------------------
kotlin-stdlib             = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-stdlib-jdk8        = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
kotlinx-coroutines-core   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test   = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollections" }
kotlinx-datetime          = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version = "0.6.2" }

# --- AndroidX core --------------------------------------------------------------------------------
androidx-core-ktx         = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat        = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-core-splashscreen     = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }
androidx-startup          = { module = "androidx.startup:startup-runtime", version.ref = "startup" }
androidx-work             = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-palette          = { module = "androidx.palette:palette-ktx", version.ref = "palette" }
androidx-exifinterface    = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }

androidx-lifecycle-runtime-ktx        = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose    = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose  = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-lifecycle-process            = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }

# --- Compose (BOM управляет версиями всех androidx.compose.*) -------------------------------------
androidx-compose-bom      = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui       = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-foundation-layout = { module = "androidx.compose.foundation:foundation-layout" }
androidx-compose-animation = { module = "androidx.compose.animation:animation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "composeMaterial3" }
androidx-compose-material3-windowsize = { module = "androidx.compose.material3.adaptive:adaptive" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
accompanist-permissions  = { module = "com.google.accompanist:accompanist-permissions", version.ref = "accompanist" }
haze                     = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
haze-materials           = { module = "dev.chrisbanes.haze:haze-materials", version.ref = "haze" }
lottie-compose           = { module = "com.airbnb.android:lottie-compose", version.ref = "lottie" }
shimmer                  = { module = "com.valentinilk.shimmer:compose-shimmer", version.ref = "shimmer" }

coil-compose             = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
coil-network-okhttp      = { module = "io.coil-kt:coil-network-okhttp", version.ref = "coil" }
coil-gif                 = { module = "io.coil-kt:coil-gif", version.ref = "coil" }
coil-video               = { module = "io.coil-kt:coil-video", version.ref = "coil" }

# --- DI -------------------------------------------------------------------------------------------
hilt-android             = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler            = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }
hilt-work                = { module = "androidx.hilt:hilt-work", version = "1.2.0" }
hilt-work-compiler       = { module = "androidx.hilt:hilt-compiler", version = "1.2.0" }

# --- Persistence ----------------------------------------------------------------------------------
room-runtime             = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx                 = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler            = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing             = { module = "androidx.room:room-testing", version.ref = "room" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
androidx-biometric       = { module = "androidx.biometric:biometric-ktx", version.ref = "biometric" }

# --- Network --------------------------------------------------------------------------------------
okhttp                   = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-logging           = { module = "com.squareup.okhttp3:logging-interceptor", version.ref = "okhttp" }
retrofit                 = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "retrofitSerialization" }

# --- Calls / Media --------------------------------------------------------------------------------
webrtc                   = { module = "io.getstream:stream-webrtc-android", version.ref = "webrtc" }
media3-exoplayer         = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui                = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-ui-compose        = { module = "androidx.media3:media3-ui-compose", version.ref = "media3" }
media3-session           = { module = "androidx.media3:media3-session", version.ref = "media3" }
media3-effect            = { module = "androidx.media3:media3-effect", version.ref = "media3" }
media3-transformer       = { module = "androidx.media3:media3-transformer", version.ref = "media3" }

# --- Observability --------------------------------------------------------------------------------
timber                   = { module = "com.jakewharton.timber:timber", version.ref = "timber" }
leakcanary               = { module = "com.squareup.leakcanary:leakcanary-android", version.ref = "leakcanary" }
desugar-jdk-libs         = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }

# --- Артефакты Gradle-плагинов (нужны ТОЛЬКО build-logic/convention) --------------------------------
agp-plugin               = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin     = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-plugin    = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin        = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradle-plugin       = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }

# --- Testing --------------------------------------------------------------------------------------
junit                    = { module = "junit:junit", version.ref = "junit" }
androidx-junit           = { module = "androidx.test.ext:junit", version.ref = "junitExt" }
androidx-espresso-core   = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
turbine                  = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
mockk                    = { module = "io.mockk:mockk", version.ref = "mockk" }
mockk-android            = { module = "io.mockk:mockk-android", version.ref = "mockk" }
robolectric              = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
truth                    = { module = "com.google.truth:truth", version.ref = "truth" }
hilt-testing             = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }
room-testing-lib         = { module = "androidx.room:room-testing", version.ref = "room" }

# --- Артефакты Gradle-плагинов статического анализа (нужны build-logic/convention) -----------------
detekt-plugin            = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-plugin            = { module = "org.jlleitschuh.gradle.ktlint:org.jlleitschuh.gradle.ktlint.gradle.plugin", version.ref = "ktlintGradle" }

[plugins]
android-application      = { id = "com.android.application", version.ref = "agp" }
android-library          = { id = "com.android.library", version.ref = "agp" }
kotlin-android           = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm               = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose           = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization     = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                      = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt                     = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kover                    = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
detekt                   = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
ktlint                   = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }

# --- Convention-плагины из build-logic ------------------------------------------------------------
silverchat-android-application = { id = "silverchat.android.application", version = "unspecified" }
silverchat-android-library     = { id = "silverchat.android.library", version = "unspecified" }
silverchat-android-compose     = { id = "silverchat.android.compose", version = "unspecified" }
silverchat-android-feature     = { id = "silverchat.android.feature", version = "unspecified" }
silverchat-android-hilt        = { id = "silverchat.android.hilt", version = "unspecified" }
silverchat-android-room        = { id = "silverchat.android.room", version = "unspecified" }
silverchat-jvm-library         = { id = "silverchat.jvm.library", version = "unspecified" }
silverchat-quality             = { id = "silverchat.quality", version = "unspecified" }

[bundles]
coroutines   = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
serialization = ["kotlinx-serialization-json", "kotlinx-collections-immutable", "kotlinx-datetime"]
compose-core = [
    "androidx-compose-ui", "androidx-compose-ui-graphics", "androidx-compose-ui-tooling-preview",
    "androidx-compose-foundation", "androidx-compose-foundation-layout", "androidx-compose-animation",
    "androidx-compose-material3", "androidx-compose-material-icons-extended",
]
compose-test = ["androidx-compose-ui-test-junit4"]
lifecycle    = [
    "androidx-lifecycle-runtime-ktx", "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose", "androidx-lifecycle-viewmodel-savedstate",
]
network      = ["okhttp", "okhttp-logging", "retrofit", "retrofit-kotlinx-serialization"]
coil         = ["coil-compose", "coil-network-okhttp", "coil-gif", "coil-video"]
media3       = ["media3-exoplayer", "media3-ui", "media3-ui-compose", "media3-session"]
persistence  = ["room-runtime", "room-ktx", "androidx-datastore-preferences"]
testing      = ["junit", "turbine", "mockk", "truth", "kotlinx-coroutines-test"]
android-testing = ["androidx-junit", "androidx-espresso-core", "robolectric", "hilt-testing"]
