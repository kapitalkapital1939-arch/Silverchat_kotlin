# ===========================================================================
# SilverChat — gradle.properties
# ===========================================================================

# --- JVM / Gradle -----------------------------------------------------------
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.vfs.watch=true

# --- AndroidX ---------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.defaults.buildfeatures.buildconfig=true

# --- AGP 9: единый Kotlin-плагин на весь проект -----------------------------
# AGP 9.0+ включает "built-in Kotlin" (KGP 2.2.10) по умолчанию.
# Мы СОЗНАТЕЛЬНО отключаем его и применяем org.jetbrains.kotlin.android
# версии из Version Catalog во ВСЕХ модулях одинаково.
# Это устраняет рассинхрон версий компилятора между :app и :core:* —
# главную причину "Module was compiled with an incompatible version of Kotlin".
#
# ВАЖНО: в AGP 10.x флаг будет удалён — при миграции убрать эти две строки
# и удалить `alias(libs.plugins.kotlin.android)` из convention-плагинов.
android.builtInKotlin=false
android.newDsl=false

# --- Kotlin -----------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# --- KSP (замена kapt; kapt в maintenance mode) -----------------------------
ksp.incremental=true
ksp.useKSP2=true

# --- Compose ----------------------------------------------------------------
android.enableComposeCompilerMetrics=false
android.enableComposeCompilerReports=false

# --- R8 / minify ------------------------------------------------------------
android.enableR8.fullMode=true

# --- Подписи и секреты (только через local.properties / env CI, НЕ в git) ----
# silverchat.keystorePath=...
# silverchat.keystorePassword=...
